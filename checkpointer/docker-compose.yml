name: flink-checkpointer

x-flink-common: &flink-common
  build: ./flink-job
  image: flink-checkpointer-job:latest
  volumes:
    # Durable checkpoint storage shared by JobManager and TaskManager.
    # It outlives container restarts, which is what makes recovery possible.
    - checkpoints:/opt/flink/checkpoints
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      taskmanager.numberOfTaskSlots: 2
      parallelism.default: 2
      state.backend.type: hashmap
      execution.checkpointing.dir: file:///opt/flink/checkpoints
      execution.checkpointing.num-retained: 3
      restart-strategy.type: fixed-delay
      restart-strategy.fixed-delay.attempts: 100
      restart-strategy.fixed-delay.delay: 5 s

services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "29092:29092" # for the Go producer running on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic user-events
        --partitions 3 --replication-factor 1
    restart: "no"

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jobmanager:
    <<: *flink-common
    command: jobmanager
    ports:
      - "8081:8081" # Flink Web UI
    healthcheck:
      test: ["CMD-SHELL", "flink list -m localhost:8081 > /dev/null 2>&1"]
      interval: 5s
      timeout: 20s
      retries: 20

  taskmanager:
    <<: *flink-common
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy

  # Submits the job once to the session cluster, then exits.
  job-submitter:
    <<: *flink-common
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      - flink
      - run
      - -d
      - -m
      - jobmanager:8081
      - /opt/flink/usrlib/flink-checkpointer.jar
      - --kafka.brokers
      - kafka:9092
      - --redis.host
      - redis
    restart: "no"

  producer:
    build: ./producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["-brokers", "kafka:9092", "-interval", "500ms"]

volumes:
  checkpoints:
